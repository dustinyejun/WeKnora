# Public entry for conversation shares: only the paths the share page needs
# reach WeKnora; login, knowledge bases and every other API return 404.
server {
    listen 80;
    client_max_body_size 1m;

    location ~ ^/(s/[A-Za-z0-9_-]+|api/v1/public/shares/.*|assets/.*|tdesign-icons/.*|config\.js|favicon\.ico|knowpulse-icon\.svg|knowpulse-login\.css)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}
